  </g>
  <g id="text_30">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #556773" transform="translate(65.52 540.618492)">Preseen, 10 Oct 2026, one run. 30 candidates nominated by a virtual committee (personas of the 2026 committee members on three language models) in the</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #556773" transform="translate(65.52 552.376195)">five leading fields of the field forecast; conditional on one of them, no "Other".</text>
