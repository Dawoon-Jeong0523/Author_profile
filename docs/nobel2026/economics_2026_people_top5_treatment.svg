  <g id="text_29">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172f40" transform="translate(65.52 501.018492)">Treatment: 14 context notes (the field forecast, the laureate age record, the prizes already awarded, the candidates with their defining works, the</text>
