# Econ forecast (2026 Sveriges Riksbank Prize in Economic Sciences): shared configuration.
# Times are America/Chicago (CDT = UTC-5). Paths are relative to this folder unless absolute.
# API keys are never stored here: only the names of the environment variables that hold them.

timezone: America/Chicago
econ_root: /project/jevans/Dawoon/Nobel Prize/Econ
today: "2026-10-09"                          # the date the research prompts state (update when re-running later)
announcement: "2026-10-12T04:45:00-05:00"     # Mon 12 Oct 2026, 11:45 CEST at the earliest (nobelprize.org)
runs_finished_by: "2026-10-11T23:00:00-05:00"

python:
  interpreter: /project/jevans/Dawoon/env/Curvature/bin/python
  ld_library_path: /project/jevans/Dawoon/env/Curvature/lib

api_keys:                                    # environment variable names, same as ../experiment/preseen/config.yaml
  anthropic: COMMITTEE_ANTHROPIC_API_KEY     # NOT ANTHROPIC_API_KEY (Claude Code's own login); never set that one
  openai: OPENAI_API_KEY
  gemini: GEMINI_API_KEY
  preseen: PRESEEN_API_KEY

models:                                      # the three models of the 2026 virtual committees (1 Oct), unchanged
  anthropic: claude-opus-5-5
  openai: gpt-5.5-2026-04-23
  gemini: gemini-3.1-pro-preview

provider_letter: {anthropic: A, openai: O, gemini: G}   # prefixes of item ids in the merged profiles

pricing:                                     # USD; tokens per 1M; search per call/query; checked 2026-10-09 (see README)
  claude-opus-5-5:        {input: 4.00, output: 20.00, search_per_1k: 10.00}
  gpt-5.5-2026-04-23:     {input: 5.00, output: 30.00, search_per_1k: 10.00}
  gemini-3.1-pro-preview: {input: 2.00, output: 12.00, search_per_1k: 14.00}
