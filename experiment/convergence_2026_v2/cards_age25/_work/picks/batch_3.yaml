  n_related: 40
  note: 'The 1969 Japanese-language first report (Kogyo Kagaku Zasshi) is not in the list. Most related works are later TiO2 photocatalysis applications and reviews (self-cleaning, superhydrophilicity, environmental cleanup) rather than water splitting itself; the 1979 Nature paper on CO2 photoreduction is related but a different reaction. The record also holds photomagnetic Prussian-blue, diamond-electrode and liquid-crystal works, which look like collaborations of the same person, not a namesake.'
