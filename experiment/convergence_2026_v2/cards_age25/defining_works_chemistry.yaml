# Defining works per chemistry person (cards_age25_v2.py cards reads this). Chosen 2026-10-06 by LLM agents
# (one per batch of _work/pool_files/<slug>.json) from the 80 most-cited research works from age 25 on, live
# OpenAlex included: up to three works most tied to the discovery of the person's option(s), landmark originals
# first; the card fills missing slots with the most-cited remaining works. 'note' = the agent's concerns.
Akira Fujishima:
  picks:
  - paper_id: W2042492216
    year: 1972
    title: Electrochemical Photolysis of Water at a Semiconductor Electrode
    metrics: true
    in_profile: true
    reason: The Fujishima-Honda Nature paper, the landmark first report of light-driven water splitting at a TiO2 semiconductor
      electrode.
  - paper_id: W2084936898
    year: 1971
    title: Electrochemical Evidence for the Mechanism of the Primary Stage of Photosynthesis
    metrics: true
    in_profile: true
    reason: Early Fujishima-Honda report of photo-induced oxygen evolution at an illuminated TiO2 electrode, the direct precursor
      of the 1972 water-photolysis paper.
  - paper_id: W2048629787
    year: 1975
    title: Hydrogen Production under Sunlight with an Electrochemical Photocell
    metrics: true
    in_profile: true
    reason: Extends the TiO2 photoelectrochemical cell to hydrogen production under real sunlight, the key early follow-up
      on solar water splitting.
  n_related: 40
  note: The 1969 Japanese-language first report (Kogyo Kagaku Zasshi) is not in the list. Most related works are later TiO2
    photocatalysis applications and reviews (self-cleaning, superhydrophilicity, environmental cleanup) rather than water
    splitting itself; the 1979 Nature paper on CO2 photoreduction is related but a different reaction. The record also holds
    photomagnetic Prussian-blue, diamond-electrode and liquid-crystal works, which look like collaborations of the same person,
    not a namesake.
