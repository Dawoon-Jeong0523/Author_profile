# Defining works per physics person (cards_age25.py cards reads this). Chosen 2026-10-05 by one LLM agent per
# person from the 80 most-cited research works from age 25 on, live OpenAlex included
# (cards_age25/_work/pool_files/<slug>.json; flags metrics/in_profile): up to
# three works most tied to the discovery of the person's option, landmark originals first; the card fills
# missing slots with the most-cited remaining works. 'note' = the agent's concerns (missing landmarks, namesakes).
