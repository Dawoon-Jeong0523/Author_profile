  note: 'The landmark papers are present: the 1981 inflation paper and the 1982 Guth-Pi fluctuations paper. The 1985 Guth-Pi
    paper "Quantum mechanics of the scalar field in the new inflationary universe" (W2173216839, 438 citations) could replace
    pick 3. It ties directly to the quantum-origin part. Pick 3 went to the 1983 paper because it has more citations. Duplicate
    records: the 1980 monopole paper (W2055148549 and W4234464502), the 1981 inflation paper (W2999585416, a 1986 reprint
    with 0 citations), "Inflationary paradigm after Planck 2013", "What can the observation of nonzero curvature tell us",
    "Do dark matter axions form a condensate", the time machine papers, and the Inflation 1993 records. Several unrelated
    works look like Guth''s own earlier particle-physics papers, not a namesake''s: the Bethe-Salpeter/pion papers (1974-76)
    and the lattice gauge papers (1980). The Cosmic Bell Test, MSW neutrino and Gravity Probe B torsion papers are later collaborations.
    W3047499632 has a null title. n_related is approximate: it counts all inflation and early-universe phase-transition works,
    including reviews and books.'
