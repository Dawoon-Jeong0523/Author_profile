    W2793525843 (Local Hamiltonian, 5 citations), W4210311038 (textbook), and two entries with null titles. W3108643359 ''Quantum
    calculations'' (1996) is ambiguous: it may be a translated or duplicate record of the 1997 paper. The 2021 Google Quantum
    AI papers (repetition-code QEC, toric-code states) are later applications with many authors. ''Entanglement in Quantum
    Critical Phenomena'' (2704 citations) is highly cited but not related to the listed discoveries. n_related = 18 core works
