# Defining works per physics person (cards_age25.py cards reads this). Chosen 2026-10-05 by one LLM agent per
# person from the 60 most-cited research works from age 25 on (cards_age25/_work/pool_files/<slug>.json): up to
# three works most tied to the discovery of the person's option, landmark originals first; the card fills
# missing slots with the most-cited remaining works. 'note' = the agent's concerns (missing landmarks, namesakes).
Alan H. Guth:
  picks:
  - paper_id: W2134251287
    year: 1981
    title: 'Inflationary universe: A possible solution to the horizon and flatness problems'
    reason: Founding 1981 paper that proposed cosmic inflation (exponential expansion solving the horizon, flatness and monopole
      problems).
  - paper_id: W2164459358
    year: 1982
    title: Fluctuations in the New Inflationary Universe
    reason: 'Guth and Pi 1982: computed density perturbations from the inflaton''s quantum fluctuations, which is the quantum
      origin of cosmic structure.'
  - paper_id: W2069871288
    year: 1983
    title: Could the universe have recovered from a slow first-order phase transition?
    reason: 'Guth and Weinberg 1983: showed old inflation''s graceful-exit failure, a key original result in how inflation
      was formulated (leading to new inflation).'
  n_related: 37
  note: 'No expected landmark is missing. The 1981 PRD paper and Guth-Pi 1982 are both in the pool. The third pick was close:
    W2173216839 ''Quantum mechanics of the scalar field in the new inflationary universe'' (Guth-Pi 1985, 438 cites) is tied
    more directly to the quantum-origin half of the citation, but it is a refinement. Guth-Weinberg 1983 won the tie-break
    on citations (550). The precursor monopole paper, Guth-Tye 1980 (W2055148549), is duplicated as W4234464502. W206194515
    (''In#ation and eternal in#ation q'') is a garbled duplicate of W1974361786. The popular book ''The Inflationary Universe''
    appears several times: W3003752728 and W2039660482, plus the German translation W2465220327 and the Spanish one W92643388.
    The time-machine paper is duplicated (W2064618604/W3094868962) but is unrelated. n_related is counted generously: it includes
    these duplicates, reviews, popular books, eternal-inflation and false-vacuum-bubble follow-ups, and the axion/low-scale-inflation
    paper. I left out the borderline 1980 Higgs-mass bound and the 1983 bouncing-universe paper. No namesake entries are evident.
    Lattice gauge theory, Bethe-Salpeter, monopole, Bell-test, axion, torsion and MSW papers are all plausibly Guth''s own,
    just unrelated to inflation.'
Albrecht Karle:
  picks:
