      quantum memory and computation. It is the landmark for both options.'
  - paper_id: W2141708961
    year: 2006
    title: Anyons in an exactly solved model and beyond
    reason: 'The Kitaev honeycomb model: an exactly solvable quantum spin liquid with Abelian and non-Abelian anyon phases.
      It is the original landmark for the spin-liquid / topological-order option.'
  - paper_id: W2159566537
    year: 1997
    title: 'Quantum computations: algorithms and error correction'
    reason: Kitaev's original 1997 treatment of quantum error correction and fault tolerance, including his threshold result
      (and Solovay-Kitaev). It is the primary source for his share of the QEC/FTQC option.
  n_related: 22
  note: 'Missing landmark: ''Topological quantum memory'' (Dennis, Kitaev, Landahl, Preskill, J. Math. Phys. 2002, highly
    cited, key to the QEC option) appears only as a garbled record with 0 citations (W2339930214, ''Topological quantum memory
    aÖ''). The main record seems to be absent from the pool. Other notable works missing from the pool: ''Unpaired Majorana
    fermions in quantum wires'' (2001), ''Periodic table for topological insulators and superconductors'' (2009), the 1997
    proceedings paper ''Quantum error correction with imperfect gates'', and ''Quantum codes on a lattice with boundary''
    (Bravyi-Kitaev 1998). Close runners-up for pick 3 were all similarly cited: magic-state distillation W2079294297 (1401),
    the GKP code W1984125696 (1406, with Preskill) and ''Topological Entanglement Entropy'' W2046439097 (2363, with Preskill).
    Entanglement entropy is a way to diagnose topological order, not a model of it. W2159566537 was published in a survey
    journal (Russian Math. Surveys), but it contains original results, so it is treated as a primary work. Duplicate or low-citation
