    year: 2016
    title: OBSERVATION AND CHARACTERIZATION OF A COSMIC MUON NEUTRINO FLUX FROM THE NORTHERN HEMISPHERE USING SIX YEARS OF
      ICECUBE DATA
    reason: 5.6 sigma observation of the cosmic neutrino flux in the independent up-going muon channel; the strongest discovery-level
      claim in the pool.
  - paper_id: W1931086765
    year: 2015
    title: Evidence for Astrophysical Muon Neutrinos from the Northern Sky with IceCube
    reason: First independent evidence (3.7 sigma) for astrophysical neutrinos from northern-sky through-going muons, confirming
      the 2013 HESE discovery.
  - paper_id: W1700467429
    year: 2015
    title: A COMBINED MAXIMUM-LIKELIHOOD ANALYSIS OF THE HIGH-ENERGY ASTROPHYSICAL NEUTRINO FLUX MEASURED WITH ICECUBE
    reason: Combined fit of several IceCube samples that measured the spectrum and flavour mix of the newly found astrophysical
      neutrino flux.
  n_related: 23
  note: 'The key landmark papers are missing from the pool. These are IceCube''s original discovery papers: ''Evidence for
    High-Energy Extraterrestrial Neutrinos at the IceCube Detector'' (Science 2013), ''First observation of PeV-energy neutrinos
    with IceCube'' (PRL 2013) and ''Observation of High-Energy Astrophysical Neutrinos in Three Years of IceCube Data'' (PRL
    2014). Also missing are the later source papers: TXS 0506+056 (Science 2018), NGC 1068 (Science 2022) and the Galactic
    plane (Science 2023). The likely cause is OpenAlex splitting his author record on large collaboration author lists. Because
    of this, the picks are the independent muon-channel confirmations (2015 at 3.7 sigma, 2016 at 5.6 sigma) and the 2015
    combined flux fit, not the HESE originals. Other possible picks: W3098322373, the HESE 7.5-year sample (a 2021 extension
    of the discovery sample), and W2070852564, a self-veto paper by Gaisser, Jero, Karle and van Santen (2014, small author
    list) giving the method behind the HESE background estimate. His detector-building role, which fits the ''pioneering contributions''
    part of the option, shows in W2588745414 (instrumentation, 770 citations), W2138307968 and W2102693142. These were not
    picked because they do not observe the discovery. n_related=23 breaks down as 7 papers that observe, characterise or use
    the astrophysical flux, 10 source or extremely-high-energy searches, and 6 IceCube detector papers. Not counted: dark
    matter, oscillation and sterile-neutrino, cosmic-ray, ARA radio, Baikal, HEGRA, GW150914 follow-up, and AMANDA-era searches
    and methods papers. No entries look like a namesake''s: HEGRA Crab 1996, Baikal 1997 (DESY Zeuthen), ARA and DM-Ice all
    fit his career.'
Alexei Y. Kitaev:
  picks:
