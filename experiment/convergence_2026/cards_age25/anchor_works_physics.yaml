    paper_id: W2055276703
    title: Long-Lived Giant Number Fluctuations in a Swarming Granular Nematic
    year: 2007
    from_person: Sriram Ramaswamy
    reason: 'Narayan, Ramaswamy & Menon 2007 is the first experimental observation, by a named person, of a signature hydrodynamic
      prediction: giant number fluctuations in active ordered matter, predicted by Ramaswamy, Simha & Toner 2003 (W2059667163).
      The 2001 micropipet paper (W2001626540) observed active membrane fluctuations, which are not central to flocking theory,
      so it was not used.'
  note: The option is a theory prize, and the named people did not experimentally realize Toner-Tu flocking order itself.
    The realization anchor is therefore the first experiment by a named person (Ramaswamy) that confirmed a core prediction
    of active-matter hydrodynamics, giant number fluctuations. Earlier flocking observations, such as Vicsek-type simulations
    and animal-flock data, were by people not named in the option and are not in the pools.
