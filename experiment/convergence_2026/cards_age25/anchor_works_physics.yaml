    from Sn 4+ –Porphyrin Complexes and Their Application to Organic Light Emitting Diodes — A Novel Mechanism for Electroluminescence''
    (W2102979770, 2009). Later works are refinements, not anchors: 2011 W1966957194 (up-conversion) and the 2012 Nature paper
    W2150702843 (the high-efficiency TADF breakthrough). TADF as a photophysical phenomenon was described long before, by
    people not named in the option, so it is not in the files.'
for the invention of atomic force microscopy:
