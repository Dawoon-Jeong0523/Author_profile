# Anchor works per discovery (cards_age25.py blocks reads this). Chosen 2026-10-05 by one LLM agent per option of
# results/options_physics.json from the pools of the named people: the first discovery/prediction paper and the
# first realization/observation paper by a named person; an anchor by people not named in the option is left out.
for the theoretical prediction and experimental discovery of topological insulators and the quantum spin Hall effect:
  n_30: 1
  anchors:
  - label: discovery/prediction
    paper_id: W2030164271
    title: Quantum Spin Hall Effect in Graphene
    year: 2005
    from_person: Charles L. Kane
    reason: Kane and Mele's original proposal of the quantum spin Hall effect, a time-reversal-invariant topological insulator.
      It came before their Z2 topological order paper from the same year and before the 3D topological insulator work in 2007.
      The same entry is also in Eugene J. Mele's file.
  - label: realization/observation
    paper_id: W2043175787
    title: Quantum Spin Hall Insulator State in HgTe Quantum Wells
    year: 2007
    from_person: Laurens W. Molenkamp
    reason: Molenkamp group's first experimental observation of the quantum spin Hall insulator state, with edge-state conductance
      in HgTe quantum wells. This was the first experimental realization of a topological insulator.
  note: 'Both anchors come from the named people''s files. Prediction anchor: the earliest Kane–Mele QSH paper (2005), chosen
    over the later Z2 paper and the 2007 3D paper. Realization anchor: König et al. 2007 (Molenkamp).'
? for the invention and development of optical lattice clocks, enabling time and frequency measurements at unprecedented precision
: n_30: 2
  anchors:
  - label: discovery/prediction
    paper_id: W1968125283
    title: SIDEBAND COOLING AND SPECTROSCOPY OF STRONTIUM ATOMS IN THE LAMB-DICKE CONFINEMENT
    year: 2002
    from_person: Hidetoshi Katori
    reason: 'Katori''s 2002 Frequency Standards and Metrology symposium proceedings paper is the original proposal of the
      optical lattice clock: Sr atoms held in a magic-wavelength lattice in the Lamb-Dicke regime. The fuller theory followed
      in the 2003 PRL ''Ultrastable Optical Clock with Neutral Atoms in an Engineered Light Shift Trap'' (W2963885768), which
      is later and more cited.'
  - label: realization/observation
    paper_id: W1985370373
    title: Spectroscopy of the S01−P03 Clock Transition of Sr87 in an Optical Lattice
    year: 2003
    from_person: Hidetoshi Katori
    reason: 'Takamoto & Katori, PRL 2003: the first experimental spectroscopy of the 87Sr 1S0-3P0 clock transition in a magic-wavelength
      optical lattice, which makes it the first realization. The 2005 Nature paper ''An optical lattice clock'' (W2008960355)
      is the later, more cited demonstration of a full clock.'
  note: Both anchors are Katori's. Jun Ye's pool has no earlier proposal or realization; his lattice-clock papers start in
    2006. If a peer-reviewed journal prediction anchor is preferred over the 2002 proceedings paper, use W2963885768 (2003).
for the theoretical prediction and experimental realization of negative index metamaterials:
  n_30: 3
  anchors:
  - label: discovery/prediction
    paper_id: W2148020016
    title: Magnetism from conductors and enhanced nonlinear phenomena
    year: 1999
    from_person: John B. Pendry
    reason: Pendry's split-ring resonator proposal for artificial negative permeability. Combined with his 1996 wire-medium
      negative permittivity, it is the theoretical design that makes a negative-index metamaterial possible. The 1996 paper
      alone gives only negative epsilon, so this is the first named-person paper that enables a negative index.
  - label: realization/observation
    paper_id: W2027652501
    title: Composite Medium with Simultaneously Negative Permeability and Permittivity
    year: 2000
    from_person: David R. Smith
    reason: First experimental demonstration (Smith et al., PRL 2000) of a microwave metamaterial that combines SRRs and wires,
      with permittivity and permeability negative at the same time (left-handed). It predates Shelby, Smith and Schultz's
      2001 'Experimental Verification of a Negative Index of Refraction', which is a later refraction measurement.
  note: The original idea of negative refractive index comes from Veselago (1968), who is not named in the option and is not
    in the pools. The prediction anchor is therefore Pendry's 1999 SRR paper, the first named-person theoretical design of
    a negative-index metamaterial. Pendry's 1996 wire-plasmon paper (W2064240847) is a precursor but covers negative permittivity
    only. Yablonovitch's pool contains photonic band-gap work and no negative-index anchor.
for the discovery of topological and geometric phases in quantum systems:
  n_30: 4
  anchors:
  - label: discovery/prediction
    paper_id: W2028948400
    title: Significance of Electromagnetic Potentials in the Quantum Theory
    year: 1959
    from_person: Yakir Aharonov
    reason: 'Aharonov-Bohm 1959 is the earliest paper in either file that predicts a topological quantum phase: an electron
      picks up a phase from electromagnetic potentials even in regions where the fields are zero. Berry''s 1984 ''Quantal
      phase factors accompanying adiabatic changes'' (W2097780038) is the original paper for the general geometric (Berry)
      phase, and Aharonov-Anandan 1987 (W2044154336) extended it to non-adiabatic cyclic evolution. Both came after the 1959
      paper.'
  note: 'There is no realization/observation anchor. The first experiments were done by people not named in the option, so
    neither file contains them: Chambers in 1960 and Tonomura et al. in 1986 observed the Aharonov-Bohm effect, and Tomita
    and Chiao in 1986 observed the Berry phase in optical fibres. Berry''s 1987 paper on Pancharatnam''s phase and coiled
    light is a later interpretation, not the first observation. If the option is read as being mainly about the geometric
    phase, the alternative discovery anchor is Berry 1984, W2097780038, ''Quantal phase factors accompanying adiabatic changes''.'
for foundational discoveries in quantum information science, including quantum cryptography and quantum algorithms:
  n_30: 5
  anchors:
  - label: discovery/prediction
    paper_id: W2015179126
    title: 'Quantum cryptography: Public key distribution and coin tossing'
    year: 2014
    from_person: Charles H. Bennett
    reason: This is the BB84 quantum key distribution proposal by Bennett and Brassard. It is the first named discovery in
      the option and predates Shor's 1994 factoring algorithm. The original paper appeared in 1984, but the files list it
      under the 2014 reprint record (the year is copied as given). The same record is in Brassard's file.
  - label: realization/observation
    paper_id: W4214950786
    title: Experimental quantum cryptography
    year: 1992
    from_person: Charles H. Bennett
    reason: This is the first experimental quantum key distribution prototype, built by Bennett, Bessette, Brassard, Salvail
      and Smolin, and published as the landmark journal paper. The same record is in Brassard's file.
  note: 'The files list the BB84 discovery anchor under year 2014, the year of the reprint record; the original proceedings
    are from 1984. An earlier 1989 record of the same prototype exists (W2079749988, ''Experimental quantum cryptography:
    the dawn of a new era...'', Brassard). It is a short announcement column, not the full experimental paper, so the 1992
    paper was chosen. The option''s quantum-algorithms part (Shor''s factoring algorithm, W3011907935 from 1994, with later
    versions W2137147061 from 1999 and W2168676717 from 2002) is a second discovery. It comes after BB84, so it is not used
    as the ''first'' anchor. The first experimental run of Shor''s algorithm (NMR, 2001) was by people not named in the option,
    so it is not in the files.'
? for the theoretical prediction and experimental discovery of correlated insulator behavior and superconductivity in magic-angle
  twisted bilayer graphene
