    title: 'Long-Range Order in a Two-Dimensional Dynamical XY Model: How Birds Fly Together'
    year: 1995
    from_person: John Toner
    reason: Toner & Tu 1995 is the original hydrodynamic (Toner-Tu) theory of flocking. It predicted true long-range orientational
      order in 2D for moving flocks, which an equilibrium system cannot have. The same paper is also in Yuhai Tu's file. The
      1998 'Flocks, herds, and schools' paper is the longer follow-up, and Ramaswamy's 2002 active-suspension hydrodynamics
      paper came later.
