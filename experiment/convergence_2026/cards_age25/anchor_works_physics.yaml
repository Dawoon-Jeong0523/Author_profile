    paper_id: W2127169435
    title: Moiré bands in twisted double-layer graphene
    year: 2011
    from_person: Allan H. MacDonald
    reason: Bistritzer-MacDonald 2011 continuum model (PNAS) that first predicted flat bands at the 'magic' twist angle in
      twisted bilayer graphene; appears in both MacDonald's and Bistritzer's files.
  - label: realization/observation
    paper_id: W2787584289
    title: Correlated insulator behaviour at half-filling in magic-angle graphene superlattices
    year: 2018
    from_person: Pablo Jarillo-Herrero
    reason: Cao, Jarillo-Herrero et al. 2018 (Nature), the first experimental observation of correlated insulating states
      in magic-angle TBG. It was published back-to-back with the superconductivity paper (W2793369479, 'Unconventional superconductivity
      in magic-angle graphene superlattices', 2018), which is the companion realization. The insulator paper is chosen as
      the first, being the earlier Nature article of the pair.
  note: Both anchors are by named people. The superconductivity paper W2793369479 (2018, Jarillo-Herrero) is the same-day
    companion of the realization anchor and could stand in as an alternate realization anchor. Earlier twisted-bilayer papers
    by Jarillo-Herrero (2012 and 2016) are not magic-angle correlated or superconducting work, so they were excluded.
for theoretical proposals and experimental realizations of quantum simulators using ultracold atoms in optical lattices:
  n_30: 7
  anchors:
  - label: discovery/prediction
    paper_id: W2035413341
    title: Cold Bosonic Atoms in Optical Lattices
    year: 1998
    from_person: J. Ignacio Cirac
    reason: 'Jaksch, Bruder, Cirac, Gardiner, Zoller 1998: the original proposal that ultracold bosons in optical lattices
      realize the Bose-Hubbard model, with a predicted superfluid-to-Mott-insulator transition. This is the founding proposal
      for lattice-based quantum simulation. The paper is also in Zoller''s file.'
  - label: realization/observation
    paper_id: W2007391198
    title: Quantum phase transition from a superfluid to a Mott insulator in a gas of ultracold atoms
    year: 2002
    from_person: Immanuel Bloch
    reason: 'Greiner, Mandel, Esslinger, Hänsch, Bloch 2002: the first experimental realization of the proposed Bose-Hubbard
      quantum simulator, observing the superfluid-Mott insulator transition in an optical lattice.'
  note: Both anchors come from the named laureates' own files. The Bloch 2001 paper on a 2D lattice of BECs (W2037879124)
    is an earlier lattice experiment, but it does not realize the proposed many-body simulator. That makes the 2002 Mott transition
    paper the first realization.
for the invention of the quantum cascade laser:
  n_30: 9
  anchors:
  - label: realization/observation
    paper_id: W4213168521
    title: Quantum Cascade Laser
    year: 1994
    from_person: Federico Capasso
    reason: The 1994 Science paper by Faist, Capasso, Sivco, Sirtori, Hutchinson and Cho is the first demonstration of the
      quantum cascade laser. It appears in all three pool files and is the earliest QCL paper in them.
  note: I left out the discovery/prediction anchor. The idea of light amplification by intersubband transitions in a superlattice
    came from Kazarinov and Suris in 1971, who are not named in this option, so their paper is not in the pool files. Capasso's
    resonant-tunneling papers from 1985-1986 are earlier, but they did not propose the cascade laser. I read the files through
    Bash and Python, not the Read tool.
