for the development of wavelet theory and multiresolution signal analysis:
  n_30: 19
  anchors:
  - label: discovery/prediction
    paper_id: W78443961
    title: Principe d'incertitude, bases hilbertiennes et algèbres d'opérateurs
    year: 1986
    from_person: Yves Meyer
    reason: Meyer's Bourbaki seminar (1985-86) first construction of a smooth orthonormal wavelet basis, the founding result
      of modern wavelet theory. 'Painless nonorthogonal expansions' (W2087377426) and 'Ondelettes et bases hilbertiennes'
      (W2013987111), both also 1986, are close alternatives.
  - label: realization/observation
    paper_id: W3024117407
    title: An efficient image representation for multiscale analysis
    year: 1987
    from_person: Stéphane Mallat
    reason: 'Earliest Mallat paper in the file to turn wavelets into a working multiresolution (pyramid) signal and image
      decomposition algorithm. The landmark full version is ''A theory for multiresolution signal decomposition: the wavelet
      representation'' (W2132984323, 1989).'
  note: Both anchors come from people named in the option. For discovery, I picked Meyer's 1986 Bourbaki orthonormal-basis
    work over the 1986 Daubechies-Grossmann-Meyer frames paper, because both are 1986 and the orthonormal basis is the founding
    result. For realization, I took Mallat's 1987 conference paper as the first technical multiresolution algorithm. Use the
    1989 PAMI paper (W2132984323) instead if the rule should be landmark-first rather than strictly earliest. Daubechies'
    1988 compactly supported wavelets (W2098914003) is a later refinement.
for theoretical discoveries of quantum spin liquids and exactly solvable models of topological order:
  n_30: 18
  anchors:
  - label: discovery/prediction
    paper_id: W2135273380
    title: Fault-tolerant quantum computation by anyons
    year: 2003
    from_person: Alexei Y. Kitaev
    reason: Kitaev's toric-code paper (preprint 1997, published 2003) is the first exactly solvable lattice model with topological
      order, a Z2 spin liquid with anyonic excitations. It is the earliest original paper in either file that makes the option's
      named discovery. The honeycomb model paper ('Anyons in an exactly solved model and beyond', 2006) came later. Patrick
      Lee's spin-liquid gauge-theory papers in his file (1989 onward) build on Anderson's RVB proposal and are not exactly
      solvable models.
  - label: realization/observation
    paper_id: W3148422733
    title: Realizing topologically ordered states on a quantum processor
    year: 2021
    from_person: Alexei Y. Kitaev
    reason: This 2021 paper with Kitaev as coauthor prepares toric-code topologically ordered ground states on a superconducting
      quantum processor and measures them. It is the earliest experimental realization in the files of the model the option
      names. Lee's experimental paper 'Evidence for quantum spin liquid behaviour in single-layer 1T-TaSe2 from scanning tunnelling
      microscopy' is also from 2021 but is less directly tied to the named discovery.
  note: The option is theoretical, and the first experimental realizations happened outside these files. Earlier toric-code
    and anyon demonstrations (photonic and NMR experiments, about 2007–2009) and spin-liquid candidate observations (for example,
    kappa-(BEDT-TTF)2Cu2(CN)3 in 2003 and herbertsmithite neutron scattering in 2012) were by people not named in the option.
    The realization anchor is therefore the earliest realization that includes a named person (Kitaev, 2021), not the first
    realization overall. If only the overall first realization should count, drop that anchor.
for the proposal of quantum computation with electron spins in semiconductor quantum dots:
  n_30: 20
  anchors:
  - label: discovery/prediction
    paper_id: W2103282498
    title: Quantum computation with quantum dots
    year: 1998
    from_person: Daniel Loss
    reason: The original Loss–DiVincenzo proposal, co-authored by both named people. It proposes using single electron spins
      in coupled semiconductor quantum dots as qubits, with exchange-based two-qubit gates. It is the earliest such paper
      in either file. The same paper (W2103282498) is also in David DiVincenzo's file.
  note: I omitted the realization/observation anchor because the first experimental realizations of spin qubits in quantum
    dots came from groups not named in this option. These are the Kouwenhoven/Vandersypen group (single-shot spin readout
    in 2004 and single-spin coherent driven rotations in 2006) and the Marcus group (Petta et al. 2005, coherent manipulation
    of coupled electron spins). None of these papers is in either file. Some experimental papers in the files have a named
    person as a co-author, but they are later refinements or variants, not the first realization. Examples are DiVincenzo's
    'Coherent spin manipulation in an exchange-only qubit' (2010), which realizes his own 2000 exchange-only variant, and
    Loss's InAs nanowire and hole-spin papers (2007).
for their studies of stellar explosions and the origin of the elements:
  n_30: 21
  anchors:
  - label: discovery/prediction
    paper_id: W2076306112
    title: The Explosive Burning of Oxygen and Silicon
    year: 1973
    from_person: Stanford Woosley
    reason: Earliest landmark paper in either file on explosive nucleosynthesis in supernovae. It is Woosley, Arnett and Clayton's
      prediction of the iron-group and intermediate-mass elements produced by explosive O/Si burning, which is the core of
      the 'origin of the elements in stellar explosions' program. It comes before Nomoto's 1976 carbon-deflagration paper
      and the 1978 presupernova models.
  note: The realization/observation anchor is omitted. The option is a theoretical-modelling program, and the observations
    that confirmed it were made by people not named in the option, so they are not in the pools. Examples are the detection
    of 56Co gamma-ray lines and the 56Ni-powered light curve of SN 1987A, and abundance patterns in metal-poor stars. The
    named people's SN 1987A papers (Woosley 1988 'Supernova 1987A - Six weeks later', Nomoto 1990 light-curve/nucleosynthesis)
    are models, not first observations. Nomoto's 1998 SN 1998bw paper is an observation of the GRB-supernova link, not of
    element origin.
for pioneering theoretical studies of fluctuations in the cosmic microwave background:
  n_30: 22
  anchors:
  - label: discovery/prediction
    paper_id: W2048017486
    title: Cosmic background radiation anisotropies in universes dominated by nonbaryonic dark matter
    year: 1984
    from_person: George Efstathiou
    reason: Bond & Efstathiou 1984 is the original calculation of the CMB anisotropy spectrum in dark-matter-dominated universes,
      including the acoustic-peak structure. It is the earliest work in either pool that makes the prediction this option
      names. The same paper ID is also in John Richard Bond's pool. The 1987 paper 'The statistics of cosmic background radiation
      fluctuations' is a later refinement.
  note: 'I left out the realization/observation anchor. Neither named person made the first observation of CMB fluctuations:
    COBE DMR detected the anisotropies in 1992 (Smoot, Mather et al.), and that paper is not in these files. Bond''s later
    observational papers in his pool, such as BOOMERANG 2000 ''A Flat Universe...'' (W3102763870), came after that first detection
    and measured the peaks in more detail, so they are not the first realization.'
