for pioneering contributions to neutrino astronomy, in particular the discovery of high-energy cosmic neutrinos:
  n_30: 10
  anchors:
  - label: realization/observation
    paper_id: W1971214100
    title: First Observation of PeV-Energy Neutrinos with IceCube
    year: 2013
    from_person: Francis Halzen
    reason: Earliest IceCube paper reporting observed high-energy (PeV) neutrino events beyond the atmospheric expectation
      (the 'Bert and Ernie' events, PRL, spring 2013). It came before the 2013 Science 'Evidence for High-Energy Extraterrestrial
      Neutrinos at the IceCube Detector' paper (W1530183786, in all three files), which is the 4-sigma discovery claim. Kurahashi
      Neilson's file also lists W1971214100.
  note: No discovery/prediction anchor is given. The idea that high-energy cosmic neutrinos exist and could be detected with
    large Cherenkov detectors came from earlier physicists who are not named in the option (Markov, Greisen, Reines and others
    in the 1960s), so no such paper is in the files. Halzen's 1995 'Particle astrophysics with high energy neutrinos' is a
    review, and his 1997 AGN flux estimate is a later refinement, so neither qualifies. If the anchor should be the formal
    discovery claim rather than the first observation, use W1530183786 'Evidence for High-Energy Extraterrestrial Neutrinos
    at the IceCube Detector' (2013) instead.
for the theoretical formulation of cosmic inflation and the prediction of the quantum origin of cosmological structure:
  n_30: 13
  anchors:
  - label: discovery/prediction
    paper_id: W2134251287
    title: 'Inflationary universe: A possible solution to the horizon and flatness problems'
    year: 1981
    from_person: Alan H. Guth
    reason: Guth's 1981 paper is the original proposal of cosmic inflation. It is the earliest paper among the three named
      people that formulates the theory the option names.
  note: No realization/observation anchor is given. The observational confirmation of inflation-generated primordial fluctuations
    came from COBE, WMAP and Planck, and none of the named people led that work, so it is not in the files. Mukhanov's 1981
    paper 'Quantum Fluctuations and a Nonsingular Universe' (W1650473789, written with Chibisov) is the original prediction
    of the quantum origin of cosmological structure. It is a strong second discovery-side anchor for the 'quantum origin'
    part of the option if an extra discovery anchor is allowed. Linde's 1982 new-inflation paper (W1973861971) is a later
    refinement of the inflation proposal, not the first.
for the invention of aberration-corrected electron optics, enabling electron microscopy with sub-ångström resolution:
  n_30: 15
  anchors:
  - label: realization/observation
    paper_id: W2018020686
    title: Aberration correction in a low voltage SEM by a multipole corrector
    year: 1995
    from_person: Maximilian Haider
    reason: Earliest paper in the files to show a working multipole aberration corrector that actually improved resolution
      in an electron microscope (Zach and Haider, low-voltage SEM). It came before the first Cs-corrected TEM (Haider/Urban
      et al., 'Electron microscopy image enhanced', Nature 1998, W1876297499) and the first Cs-corrected STEM (Krivanek, 'Towards
      sub-Å electron beams', 1999). It is the first realization of aberration-corrected electron optics by a named laureate.
  note: No discovery/prediction anchor is given. The original proposals for correcting aberrations (Scherzer 1947 on multipole
    correctors, and Rose 1990 on the hexapole Cs corrector design that Haider built) are by people not named in the option,
    so they are not in the files. If the anchor should be the first corrected TEM rather than the first working corrector
    of any kind, use W1876297499, 'Electron microscopy image enhanced' (1998). If the anchor should be the first sub-ångström
    demonstration, use W1968240415, 'Sub-ångstrom resolution using aberration corrected electron optics' (2002, Krivanek).
for advancing the understanding of the surprising properties of two-dimensional electron systems in strong magnetic fields:
  n_30: 8
  anchors:
  - label: discovery/prediction
    paper_id: W1995680910
    title: Composite-fermion approach for the fractional quantum Hall effect
    year: 1989
    from_person: Jainendra K. Jain
    reason: Jain's original proposal of composite fermions. It is the theoretical concept that explains the surprising fractional
      quantum Hall properties named in the option, and it is the earliest original theory paper in the three files.
  - label: realization/observation
    paper_id: W1993147119
    title: Observation of an even-denominator quantum number in the fractional quantum Hall effect
    year: 1987
    from_person: James P. Eisenstein
    reason: 'This is the earliest landmark experimental observation of a surprising strong-field 2D electron property by one
      of the named people: the 5/2 even-denominator FQH state (Willett, Eisenstein et al.). Two later observations are also
      landmarks but come after it. Heiblum''s direct observation of fractional charge is W1657455754 (1997). Jain''s co-authored
      detection of composite fermions by magnetic focusing is W2075980613 (1994).'
  note: 'The option is broad and names no single discovery. The FQHE itself was discovered by Tsui, Stormer and Gossard (1982),
    who are not named in the option, so their paper is not in the files. Within the files, the earliest observation is Eisenstein
    1987 (5/2 state). It came before Jain''s composite-fermion theory (1989), so the two anchors are not a strict prediction-then-realization
    pair. If the anchor should instead confirm Jain''s theory or Laughlin quasiparticles, two alternatives fit. Jain-coauthored
    composite-fermion detection: W2075980613 (1994). Heiblum''s fractional charge observation: W1657455754 (1997). The first
    composite-fermion Fermi-surface evidence (Willett et al. 1993, SAW) is by people not named in the option.'
for the discovery of quantum error correction and fault-tolerant quantum computation:
  n_30: 11
  anchors:
  - label: discovery/prediction
    paper_id: W1999706070
    title: Scheme for reducing decoherence in quantum computer memory
    year: 1995
    from_person: Peter W. Shor
    reason: 'Shor''s 1995 nine-qubit code paper is the first proposal of quantum error correction. Later work builds on it:
      Shor''s fault-tolerant error correction (1996), Kitaev''s anyons and toric code, and Preskill''s threshold papers.'
  note: 'I left out the realization/observation anchor. The first experimental demonstrations of quantum error correction
    (Cory et al., NMR, 1998) and later fault-tolerant hardware were done by groups that do not include Preskill, Shor or Kitaev,
    so those papers are not in the files. The work by the named people that follows the 1995 paper is all theory: Shor 1996
    on fault-tolerant error correction, Kitaev 1997/2003 on anyons, and Preskill 1998 on reliable quantum computers.'
for numerical simulations that established the cold dark matter model of the formation of cosmic structure:
  n_30: 14
  anchors:
  - label: realization/observation
    paper_id: W2032469582
    title: The evolution of large-scale structure in a universe dominated by cold dark matter
    year: 1985
    from_person: Marc Davis
    reason: Davis, Efstathiou, Frenk and White (DEFW) 1985 was the first N-body simulation of cosmic structure formation in
      a CDM universe. It is the founding simulation that established CDM as the model for large-scale structure. The same
      paper appears in all three pool files.
  note: 'I gave only the realization anchor. The cold dark matter model itself was first proposed by people not named in the
    option (Peebles 1982; Blumenthal, Faber, Primack and Rees 1984), so none of the pool files has a separate earlier prediction
    paper for it. The named trio''s discovery is the DEFW 1985 simulation result itself, which is why it is listed once, as
    realization/observation. Two of their earlier papers in the pools are precursors only and were not used as the prediction
    anchor: White & Rees 1978, "Core condensation in heavy halos" (W1999367759), which proposed galaxy formation in dark halos
    but not CDM; and White, Frenk & Davis 1983, "Clustering in a neutrino-dominated universe" (W1980304714), a simulation
    that ruled out hot dark matter.'
? for the development of highly efficient organic light-emitting diodes based on phosphorescent and thermally activated delayed
  fluorescence emitters
: n_30: 16
  anchors:
  - label: realization/observation
    paper_id: W1668566020
    title: Highly efficient phosphorescent emission from organic electroluminescent devices
    year: 1998
    from_person: Mark E. Thompson
    reason: Baldo, O'Brien, ..., Thompson, Forrest (Nature 1998) is the first demonstration of a phosphorescent OLED. The
      PtOEP-doped device harvested triplet excitons, and this is the founding paper of the phosphorescent half of the option.
      It is an invention paper with no separate earlier proposal by the named people, so it is given once as the realization.
